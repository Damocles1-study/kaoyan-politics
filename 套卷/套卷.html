<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e2231a">
<title>整卷模考</title>
<link rel="stylesheet" href="../assets/style.css?v=sect1">
<link rel="stylesheet" href="../assets/skin.css?v=3">
<script src="../assets/skin.js?v=3"></script>
<style>
  /* 套卷列表 */
  .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:6px}
  .pc{border:2px solid var(--ink-line);border-radius:4px;background:var(--card);padding:12px 14px;box-shadow:3px 3px 0 var(--drop);display:flex;flex-direction:column;gap:6px}
  .pc h3{font-family:var(--serif);font-weight:900;font-size:1.08rem;margin:0}
  .pc .meta{font-size:.82rem;color:var(--muted);line-height:1.6}
  .pc .meta b{color:var(--accent);font-family:var(--round);font-style:italic;font-size:1.1em}
  .pc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
  .pc.done{background-image:var(--tone)}
  /* 作答区 */
  .sec-h{font-family:var(--serif);font-weight:900;font-size:1.05rem;margin:26px 0 4px;padding:4px 12px;display:inline-block;color:var(--card);background:var(--ink);clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
  .sec-n{font-size:.84rem;color:var(--muted);margin:2px 0 0}
  .qcard{padding:16px 16px 14px;margin-top:14px;position:relative;scroll-margin-top:70px}
  .qmeta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:8px}
  .qidx{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;margin:-4px 6px 0 -4px;
    font-family:var(--round);font-style:italic;font-weight:800;font-size:1.05rem;color:#fff;background:var(--ink);border:2px solid var(--ink-line);
    clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%)}
  .stem{font-size:1.02rem;line-height:1.9;color:var(--ink);overflow-wrap:anywhere}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .opt{position:relative;display:flex;gap:11px;align-items:flex-start;text-align:left;border:2px solid var(--ink-line);background:var(--card);color:var(--ink);border-radius:4px;padding:8px 12px;
    font:inherit;font-size:.95rem;line-height:1.65;cursor:pointer;min-height:44px;box-shadow:2px 2px 0 var(--drop);transition:transform .1s var(--ease),box-shadow .1s,background .15s}
  .opt:hover{background:var(--bg)}
  .opt .ol{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-line);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:.84rem;margin-top:1px;font-family:var(--round);background:var(--card)}
  .opt.sel{background:var(--blue-soft);background-image:var(--tone);transform:translate(1px,1px);box-shadow:1px 1px 0 var(--drop)}
  .opt.sel .ol{background:var(--ink);color:var(--card)}
  .opt.lock{cursor:default}
  .opt.right{background:var(--green-soft)}
  .opt.right .ol{background:var(--card);border:3px solid var(--accent);color:var(--accent);transform:rotate(-8deg) scale(1.12)}
  .opt.wrong{background:var(--red-soft);background-image:repeating-linear-gradient(-45deg,transparent 0 6px,color-mix(in srgb,var(--red) 12%,transparent) 6px 8px)}
  .opt.wrong .ol{background:var(--red);border-color:var(--ink-line);color:#fff}
  .opt.miss{border-style:dashed;background:var(--green-soft)}
  .opt.miss .ol{border-color:var(--green);color:var(--green)}
  .verdict{position:relative;margin-top:12px;padding:8px 64px 8px 14px;border:2px solid var(--ink-line);border-radius:4px;background:var(--bg);font-size:.94rem;font-weight:700}
  .verdict.ok{background:var(--green-soft);color:var(--green)} .verdict.bad{background:var(--red-soft);color:var(--red)} .verdict.blank{background:var(--gold-soft);color:var(--gold)}
  .verdict.ok::after,.verdict.bad::after{position:absolute;right:16px;top:50%;font-family:var(--serif);font-weight:900;line-height:1;color:var(--accent);transform:translateY(-50%) rotate(-12deg);pointer-events:none}
  .verdict.ok::after{content:"〇";font-size:2.3rem} .verdict.bad::after{content:"✕";font-size:2rem}
  .jx,.ea{margin-top:10px;padding:11px 14px;border:2px solid var(--ink-line);border-radius:4px;background:var(--card);font-size:.92rem;line-height:1.85;overflow-wrap:anywhere}
  .ea{background:var(--gold-soft);border-width:3px;border-style:double}
  .eh{display:inline-block;font-weight:900;font-size:.8rem;color:#fff;background:var(--ink);padding:0 9px 0 7px;margin-bottom:6px;clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%)}
  .neg{color:#fff;font-weight:900;background:var(--accent);padding:0 3px}
  .src{font-size:.78rem;color:var(--muted);margin-top:8px}
  .mine-ta{width:100%;min-height:120px;margin-top:10px;font:inherit;font-size:.93rem;line-height:1.75;border:2px solid var(--ink-line);border-radius:4px;padding:10px 12px;background:var(--card);color:var(--ink);box-shadow:inset 2px 2px 0 var(--bg2)}
  .erow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:.86rem;font-weight:700;color:var(--ink2)}
  .erow input[type=number]{width:64px;font:inherit;font-weight:800;padding:4px 6px;border:2px solid var(--ink-line);border-radius:4px;background:var(--card);color:var(--ink)}
  .ask-l{margin-top:8px;padding-left:1.3em} .ask-l li{margin:3px 0;font-weight:700}
  /* 顶部常驻条 */
  #dock{position:sticky;top:0;z-index:6;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;margin:0 -4px;border:3px solid var(--ink-line);background:var(--card);box-shadow:3px 3px 0 var(--drop)}
  #dock .ttl{font-weight:900;font-size:.9rem;flex:1 1 140px;min-width:0}
  #dock .tm{font-family:var(--round);font-style:italic;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
  #dock .tm.warn{color:var(--accent)}
  #dock .cnt{font-size:.82rem;color:var(--ink2);font-weight:700}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
  #grid[hidden]{display:none}
  .gi{border:2px solid var(--ink-line);background:var(--card);color:var(--ink);border-radius:3px;padding:3px 0;font-size:.84rem;font-weight:800;font-style:italic;cursor:pointer;font-family:var(--round);box-shadow:2px 2px 0 var(--drop)}
  .gi.a{background:var(--ink);color:var(--card)} .gi.g{background:var(--green-soft);color:var(--green)} .gi.r{background:var(--red);color:#fff}
  .gi.e{border-style:dashed}
  /* 成绩 */
  .score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .score .big{font-family:var(--round);font-style:italic;font-size:2.6rem;font-weight:800;line-height:1;color:var(--accent)}
  .score .big small{font-size:.9rem;color:var(--muted);font-style:normal;font-family:var(--sans)}
  table.by{border-collapse:collapse;width:100%;font-size:.88rem;margin-top:10px}
  table.by th,table.by td{border:1.5px solid var(--ink-line);padding:5px 8px;text-align:center;white-space:nowrap}
  table.by th{background:var(--bg2)}
  table.by td.l{text-align:left}
  .bar{height:9px;border:1.5px solid var(--ink-line);background:var(--bg2);border-radius:2px;overflow:hidden;min-width:60px}
  .bar i{display:block;height:100%;background:var(--green)}
  .hist{font-size:.84rem;color:var(--ink2);line-height:1.8}
  .only-w .qcard.okq{display:none}
  .chkbar{margin:0 0 12px;padding:8px 12px;border:2px dashed var(--gold);background:var(--gold-soft);color:var(--ink);font-size:.86rem;font-weight:700;line-height:1.6}
  .seg button{white-space:nowrap}
  @media (max-width:700px){ .plist{grid-template-columns:1fr} }
  /* 秒杀笔记 · 知识点弹窗（2026-11-16） */
  .qcard .miao,.qcard .img,.qcard .kj,.qcard .xk,.qcard .mem,.qcard .juan{margin:12px 0 0}
  .kj::before{content:"口诀"!important;background:var(--accent)!important}
  .xk::before{content:"新口径"!important}
  .juan::before{content:"卷面怎么写"!important;background:var(--ink)!important}
  .mem .gu{margin:0;padding-left:1.4em} .mem .gu li{margin:5px 0}
  .lk{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:10px;padding:9px 14px;border:2px solid var(--ink-line);border-radius:4px;background:var(--blue-soft);color:var(--blue);font-weight:800;text-decoration:none;
    box-shadow:3px 3px 0 var(--drop);transition:transform .1s,box-shadow .1s;overflow-wrap:anywhere}
  .lk:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--drop)}
  .lk .kpgo{margin-left:auto;font-size:.8rem;font-weight:700;opacity:.8;white-space:nowrap}
  #kp{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  #kp[hidden]{display:none}
  .kp-bg{position:absolute;inset:0;background:rgba(10,10,10,.55)}
  .kp-win{position:relative;width:min(760px,100%);max-height:min(86vh,900px);display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:3px solid var(--ink-line);border-radius:4px;box-shadow:6px 6px 0 var(--drop)}
  .kp-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:2px solid var(--ink-line);background:var(--bg)}
  .kp-h b{flex:1 1 200px;min-width:0;font-family:var(--serif);font-weight:900;font-size:1rem;line-height:1.4}
  .kp-b{overflow:auto;padding:4px 16px 16px;overscroll-behavior:contain;overflow-wrap:anywhere}
  .kp-b .kp-sec{border:0;box-shadow:none;background:none;padding:0;margin:0}
  .kp-b table{font-size:.86rem}
  html.kp-on{overflow:hidden}
  @media (max-width:700px){ #kp{padding:8px} .kp-win{max-height:92vh} .kp-b{padding:4px 12px 14px} }
</style>
</head>
